[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-a2l-bin-cli-map-editor"
version = "0.3.0a0"
description = "AI-native, conservative A2L/BIN calibration inspection and scalar editing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KingAI Pty Ltd"}]
dependencies = []

[project.scripts]
kingai-a2l = "kingai_a2l.cli:main"

[tool.setuptools.packages.find]
include = ["kingai_a2l*"]
